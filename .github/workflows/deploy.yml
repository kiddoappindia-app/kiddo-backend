name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  IMAGE: gcr.io/${{ vars.GCP_PROJECT_ID }}/kiddo-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push image
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: kiddo-backend
          region: ${{ vars.GCP_REGION }}
          image: $IMAGE:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --timeout=300
          env_vars: |-
            NODE_ENV=production
            PORT=8080
            CLIENT_ORIGIN=${{ vars.CLIENT_ORIGIN }}
            JWT_ACCESS_EXPIRES_IN=${{ vars.JWT_ACCESS_EXPIRES_IN }}
            JWT_REFRESH_EXPIRES_IN=${{ vars.JWT_REFRESH_EXPIRES_IN }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          secrets: |-
            MONGODB_URI=mongodb-uri:latest
            JWT_ACCESS_SECRET=jwt-access-secret:latest
            JWT_REFRESH_SECRET=jwt-refresh-secret:latest
            FIREBASE_SERVICE_ACCOUNT_KEY=firebase-service-account-key:latest

      - name: Output service URL
        run: echo "Service URL: ${{ steps.deploy.outputs.url }}"