name: Deploy to Cloud Run (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-dev
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  IMAGE: gcr.io/${{ vars.GCP_PROJECT_ID_DEV }}/kiddo-backend-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_DEV }}

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push image
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: kiddo-backend-dev
          region: ${{ vars.GCP_REGION_DEV }}
          image: $IMAGE:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --timeout=300
          env_vars: |-
            NODE_ENV=development
            PORT=8080
            CLIENT_ORIGIN=${{ vars.CLIENT_ORIGIN_DEV }}
            JWT_ACCESS_EXPIRES_IN=${{ vars.JWT_ACCESS_EXPIRES_IN_DEV }}
            JWT_REFRESH_EXPIRES_IN=${{ vars.JWT_REFRESH_EXPIRES_IN_DEV }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID_DEV }}
          secrets: |-
            MONGODB_URI=mongodb-uri-dev:latest
            JWT_ACCESS_SECRET=jwt-access-secret-dev:latest
            JWT_REFRESH_SECRET=jwt-refresh-secret-dev:latest
            FIREBASE_SERVICE_ACCOUNT_KEY=firebase-service-account-key-dev:latest

      - name: Output service URL
        run: echo "Dev service URL: ${{ steps.deploy.outputs.url }}"